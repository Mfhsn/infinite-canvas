services:
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - app_env
    ports:
      - "3000:3000"
    environment:
      DATA_STORAGE_DRIVER: ${DATA_STORAGE_DRIVER:-browser}
      STORAGE_NAMESPACE: ${STORAGE_NAMESPACE:-default}
      STORAGE_MAX_FILE_MB: ${STORAGE_MAX_FILE_MB:-128}
      STORAGE_MAX_DOCUMENT_MB: ${STORAGE_MAX_DOCUMENT_MB:-16}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-infinite_canvas}
      MYSQL_USER: ${MYSQL_USER:-infinite_canvas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-infinite_canvas}
      MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT:-10}
      MYSQL_CONNECT_ATTEMPTS: ${MYSQL_CONNECT_ATTEMPTS:-30}
      MYSQL_CONNECT_RETRY_MS: ${MYSQL_CONNECT_RETRY_MS:-2000}
      MYSQL_SSL: ${MYSQL_SSL:-false}
      INTEGRATION_ENABLED: ${INTEGRATION_ENABLED:-false}
      INTEGRATION_BASE_URL: ${INTEGRATION_BASE_URL:-}
      INTEGRATION_TLS_SERVER_NAME: ${INTEGRATION_TLS_SERVER_NAME:-}
      INTEGRATION_TLS_DISABLE_SNI: ${INTEGRATION_TLS_DISABLE_SNI:-false}
      INTEGRATION_EXTERNAL_PROJECT_ID: ${INTEGRATION_EXTERNAL_PROJECT_ID:-}
      INTEGRATION_SOURCE_SYSTEM: ${INTEGRATION_SOURCE_SYSTEM:-}
      INTEGRATION_SESSION_SECRET: ${INTEGRATION_SESSION_SECRET:-}
      INTEGRATION_COOKIE_NAME: ${INTEGRATION_COOKIE_NAME:-infinite_canvas_session}
      INTEGRATION_COOKIE_SECURE: ${INTEGRATION_COOKIE_SECURE:-false}
      INTEGRATION_SESSION_TTL_SECONDS: ${INTEGRATION_SESSION_TTL_SECONDS:-86400}
      INTEGRATION_CONNECT_TIMEOUT_MS: ${INTEGRATION_CONNECT_TIMEOUT_MS:-30000}
      INTEGRATION_REQUEST_TIMEOUT_MS: ${INTEGRATION_REQUEST_TIMEOUT_MS:-180000}
      VITE_DOC_URL: ${VITE_DOC_URL:-}
      VITE_AI_CONFIG_OVERRIDE: ${VITE_AI_CONFIG_OVERRIDE:-}
      VITE_AI_CHANNELS_JSON: ${VITE_AI_CHANNELS_JSON:-}
      VITE_AI_CHANNEL_ID: ${VITE_AI_CHANNEL_ID:-}
      VITE_AI_CHANNEL_NAME: ${VITE_AI_CHANNEL_NAME:-}
      VITE_AI_API_FORMAT: ${VITE_AI_API_FORMAT:-}
      VITE_AI_BASE_URL: ${VITE_AI_BASE_URL:-}
      VITE_AI_LLM_MAX_COMPLETION_TOKENS: ${VITE_AI_LLM_MAX_COMPLETION_TOKENS:-4096}
      VITE_AI_API_KEY: ${VITE_AI_API_KEY:-}
      VITE_AI_PLATFORM_ID: ${VITE_AI_PLATFORM_ID:-}
      VITE_DREAM_IMAGE_PLATFORM_ID: ${VITE_DREAM_IMAGE_PLATFORM_ID:-}
      VITE_DREAM_VIDEO_PLATFORM_ID: ${VITE_DREAM_VIDEO_PLATFORM_ID:-}
      VITE_AI_MODELS: ${VITE_AI_MODELS:-}
      VITE_AI_TASK_TIMEOUT_MS: ${VITE_AI_TASK_TIMEOUT_MS:-}
      VITE_DEFAULT_IMAGE_MODEL: ${VITE_DEFAULT_IMAGE_MODEL:-}
      VITE_DEFAULT_VIDEO_MODEL: ${VITE_DEFAULT_VIDEO_MODEL:-}
      VITE_DEFAULT_TEXT_MODEL: ${VITE_DEFAULT_TEXT_MODEL:-}
      VITE_DEFAULT_AUDIO_MODEL: ${VITE_DEFAULT_AUDIO_MODEL:-}
      VITE_DEFAULT_SYSTEM_PROMPT: ${VITE_DEFAULT_SYSTEM_PROMPT:-}
      VITE_DEFAULT_IMAGE_SIZE: ${VITE_DEFAULT_IMAGE_SIZE:-}
      VITE_DEFAULT_IMAGE_QUALITY: ${VITE_DEFAULT_IMAGE_QUALITY:-}
      VITE_DEFAULT_IMAGE_COUNT: ${VITE_DEFAULT_IMAGE_COUNT:-}
      VITE_DEFAULT_CANVAS_IMAGE_COUNT: ${VITE_DEFAULT_CANVAS_IMAGE_COUNT:-}
      VITE_DEFAULT_VIDEO_SECONDS: ${VITE_DEFAULT_VIDEO_SECONDS:-}
      VITE_DEFAULT_VIDEO_QUALITY: ${VITE_DEFAULT_VIDEO_QUALITY:-}
      VITE_DEFAULT_AUDIO_VOICE: ${VITE_DEFAULT_AUDIO_VOICE:-}
      VITE_DEFAULT_AUDIO_FORMAT: ${VITE_DEFAULT_AUDIO_FORMAT:-}
      VITE_DEFAULT_AUDIO_SPEED: ${VITE_DEFAULT_AUDIO_SPEED:-}
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    command: ["--max-allowed-packet=256M", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-infinite_canvas}
      MYSQL_USER: ${MYSQL_USER:-infinite_canvas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-infinite_canvas}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-infinite_canvas_root}
    volumes:
      - infinite-canvas-mysql-local:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  infinite-canvas-mysql-local:

secrets:
  app_env:
    file: .env
